server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback for React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # New staging BE (hermetic VPS stack) — hanya untuk API berversi /api/v1/.
    location /api/v1/ {
        proxy_pass http://be-staging:3000/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverse proxy to live Biru Langit AQMS API (avoids CORS in staging).
    # Dari awal tetap seperti ini untuk endpoint legacy (Telkom stations,
    # /api/telkom/all, /api/:location/2m, /api/logs) — jangan diganti.
    location /api/ {
        proxy_pass https://biru-langit.com/api/;
        proxy_ssl_server_name on;
        proxy_set_header Host biru-langit.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }
}
