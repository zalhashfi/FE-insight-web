name: CI

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]

# Least privilege: the default GITHUB_TOKEN is broad; this workflow only reads code.
permissions:
  contents: read


jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Type-check & build
        run: npm run build

      - name: Run tests
        run: npm test
